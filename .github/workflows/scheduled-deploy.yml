name: Scheduled rebuild (refresh citation counts)

# Rebuilds and redeploys the site on a schedule so citation counts scraped
# from Google Scholar at build time stay current without a manual deploy.
#
# GitHub only recognizes `schedule:` triggers from a workflow file on the
# repo's default branch, so keep this file on whichever branch that is.

on:
  schedule:
    - cron: '0 18 * * 0' # every Monday 12:00 AM BDT (UTC+6) = Sunday 18:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - run: yarn build
        env:
          GATSBY_CPU_COUNT: 1

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: main
